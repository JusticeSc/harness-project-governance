name: Public package checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core / ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.19.0', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm run verify
      - run: npm run demo
      - run: npm run smoke
      - run: npm run test-adoption

  documentation-tools:
    name: Optional documentation module regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci --prefix tools/doc-gates --ignore-scripts
      - run: npm run test-doc-gates
      - run: npm run verify-md-links
      - run: npm run verify-md-wrap
      # The exporter copies the npm allowlist plus authored docs; run the exported copy as a consumer would.
      - name: Export the allowlisted public package
        run: node scripts/export-public.mjs "$RUNNER_TEMP/public-export"
      - name: Run the exported copy
        working-directory: ${{ runner.temp }}/public-export
        run: |
          npm run verify
          npm run demo
